name: Attach dist to Release

# Manual re-attach (e.g. older tags). New releases get the zip from Release Please.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (e.g. v0.1.1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build dist
        run: ./mvnw -B -DskipTests package

      - name: Upload linux dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          ARTIFACT="pdf-toolkit-${TAG}-linux.zip"
          cp target/*-dist.zip "${ARTIFACT}"
          unzip -l "${ARTIFACT}"
          gh release upload "${TAG}" "${ARTIFACT}" --clobber
