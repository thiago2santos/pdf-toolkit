name: Release Please

on:
  push:
    branches:
      - pre-release
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Create Release PR / GitHub Release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: pre-release
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Release outputs (debug)
        if: always()
        run: |
          echo "release_created=${{ steps.release.outputs.release_created }}"
          echo "prs_created=${{ steps.release.outputs.prs_created }}"
          echo "tag_name=${{ steps.release.outputs.tag_name }}"

      # GITHUB_TOKEN tag/release events do not cascade to other workflows.
      # Build and attach the dist zip in the same job when a release is cut.
      - name: Checkout release tag
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag_name }}

      - name: Set up JDK 25
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build dist zip
        if: ${{ steps.release.outputs.release_created }}
        run: ./mvnw -B -DskipTests package

      - name: Upload linux dist to GitHub Release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          ARTIFACT="pdf-toolkit-${TAG}-linux.zip"
          cp target/*-dist.zip "${ARTIFACT}"
          unzip -l "${ARTIFACT}"
          gh release upload "${TAG}" "${ARTIFACT}" --clobber
